<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>kaaninho's mp3</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
    <div class="app-wrapper">
        <div class="player-container">
            <div class="window-nav">
                <button class="nav-icon" id="pip-toggle-btn" title="Mini Player" style="font-size: 13px;">◱</button>
                <button class="nav-icon" id="min-btn">-</button>
                <button class="nav-icon" id="close-btn">×</button>
            </div>

            <div style="position: absolute; left: 20px; top: 18px; display: flex; gap: 8px; z-index: 50;">
                <button id="yt-toggle-btn" class="yt-icon-btn">YT</button>
                <button id="list-toggle-btn" class="yt-icon-btn" style="background: #6c5ce7;">LIST</button>
            </div>

            <div class="header">
                <div class="pill-title">
                    <h2 id="song-title">kaaninho's mp3</h2>
                </div>
            </div>

            <div class="visual-area">
                <div class="screen-frame">
                    <div class="display-box" id="water-game-container">
                        <canvas id="game-canvas"></canvas>
                    </div>
                </div>
                <div class="theme-dots" style="display: flex; justify-content: space-between; width: 100%;">
                    <div style="display: flex; gap: 8px;">
                        <div class="theme-dot" style="background:#e2d5e7;" data-theme="default" title="Default"></div>
                        <div class="theme-dot" style="background:#333;" data-theme="black" title="Black"></div>
                        <div class="theme-dot" style="background:#fdcb6e;" data-theme="yellow" title="Yellow"></div>
                        <div class="theme-dot" style="background:#ffcccc;" data-theme="pink" title="Pink"></div>
                        <div class="theme-dot" style="background:#64bff3;" data-theme="blue" title="Blue"></div>
                    </div>
                </div>
            </div>

            <div id="yt-panel" class="yt-panel hidden">
                <div class="yt-search-box">
                    <input type="text" id="yt-search-input" placeholder="Search YouTube...">
                    <button id="yt-clear-btn" style="color: #ff4757; font-size: 14px;" title="Clear Search">🗑</button>
                    <button id="yt-search-btn">🔍</button>
                </div>
                <div id="yt-results" class="yt-results-list">
                    <p style="font-size: 8px; color: #7a6a81; text-align:center; margin-top:20px;">SEARCH TO PLAY</p>
                </div>
                <button id="yt-close-btn">CLOSE PANEL</button>
            </div>

            <div class="controls-area">
                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">

                <div class="main-btns">
                    <button id="fav-btn" class="heart-btn">❤</button> 
                    <button class="nav-btn" id="restart-btn">⏮</button>
                    <div class="play-shell">
                        <button id="play-btn">▶</button>
                    </div>
                    <button class="nav-btn" id="add-btn">⏭</button>
                    <button class="nav-btn" id="local-file-btn" style="font-size: 16px;">📂</button>
                </div>

                <div class="utility-row">
                    <button id="loop-btn">🔁</button>
                    <div class="vol-wrapper">
                        <input type="range" id="volume-slider" min="0" max="100" step="2" value="50">
                    </div>
                    <button id="shuffle-btn">🔀</button>
                </div>

                <div class="fx-grid">
                    <button class="fx-btn" id="slow-btn">SLOW</button>
                    <button class="fx-btn" id="speed-btn">SPEED</button>
                    <button class="fx-btn" id="reverb-btn">REVERB</button>
                    <button class="fx-btn" id="bass-btn">BASS</button>
                    <button class="fx-btn" id="8d-btn">8D</button>
                    <button class="fx-btn" id="muffle-btn">MUFFLE</button>
                </div>
            </div>

            <input type="file" id="file-input" accept="audio/*" style="display: none;">
        </div>

        <div id="pip-player-container" class="pip-player-container" style="display: none;">
            <img id="pip-ambient-glow" class="pip-ambient-glow" src="assets/icon.png" alt="" aria-hidden="true">
            <div class="pip-header">
                <div class="pip-drag-zone">
                    <span class="pip-logo-dot"></span>
                    <span class="pip-title-text">kaaninho's mp3</span>
                </div>
                <div class="pip-nav-btns">
                    <button class="pip-nav-btn" id="pip-expand-btn" title="Expand to Normal Player">⤢</button>
                    <button class="pip-nav-btn" id="pip-close-btn" title="Close">×</button>
                </div>
            </div>

            <div class="pip-cover-wrapper" id="pip-cover-wrapper">
                <img id="pip-cover-img" class="pip-cover-img" src="assets/icon.png" alt="Cover Art" referrerpolicy="no-referrer">
                
                <div class="pip-hover-overlay" id="pip-hover-overlay">
                    <div class="pip-controls-row">
                        <div class="pip-controls-side pip-controls-left">
                            <div class="pip-vol-group">
                                <button class="pip-ctrl-btn" id="pip-mute-btn">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                </button>
                                <div class="pip-vol-slider-wrap">
                                    <input type="range" class="pip-vol-slider" id="pip-vol-slider" min="0" max="100" value="50">
                                </div>
                            </div>
                            <button class="pip-ctrl-btn" id="pip-shuffle-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                            </button>
                            <button class="pip-ctrl-btn" id="pip-prev-btn">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                            </button>
                        </div>
                        <button class="pip-main-play-btn" id="pip-play-btn">
                            <svg id="pip-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div class="pip-controls-side pip-controls-right">
                            <button class="pip-ctrl-btn" id="pip-next-btn">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                            </button>
                            <button class="pip-ctrl-btn" id="pip-loop-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                            </button>
                            <button class="pip-ctrl-btn pip-fx-trigger" id="pip-fx-btn">FX</button>
                        </div>
                    </div>

                    <div class="pip-fx-popover hidden" id="pip-fx-popover">
                        <button class="pip-fx-btn" id="pip-fx-slow">SLOW</button>
                        <button class="pip-fx-btn" id="pip-fx-speed">SPEED</button>
                        <button class="pip-fx-btn" id="pip-fx-reverb">REVERB</button>
                        <button class="pip-fx-btn" id="pip-fx-bass">BASS</button>
                        <button class="pip-fx-btn" id="pip-fx-8d">8D</button>
                        <button class="pip-fx-btn" id="pip-fx-muffle">MUFFLE</button>
                    </div>
                </div>

                <div class="pip-cover-progress-wrap">
                    <div class="pip-time-row">
                        <span id="pip-current-time">0:00</span>
                        <span id="pip-duration">0:00</span>
                    </div>
                    <input type="range" id="pip-progress-bar" value="0" min="0" max="100" step="0.1">
                </div>
            </div>

            <div class="pip-bottom-bar">
                <div class="pip-info-row">
                    <div class="pip-song-meta">
                        <div id="pip-song-title" class="pip-song-title">kaaninho's mp3</div>
                        <div id="pip-song-artist" class="pip-song-artist">YouTube Audio</div>
                    </div>
                </div>
                <div id="pip-resize-grip" class="pip-resize-grip">
                    <svg width="10" height="10" viewBox="0 0 11 11" fill="none">
                        <path d="M9 2L2 9M10 5L5 10M10 8L8 10" stroke="#7e7e86" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <div id="playlist-sidebar" class="playlist-sidebar">
            <div style="width: 100%; padding: 12px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box;">
                <div class="sidebar-tabs" style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <button id="tab-playlists-btn" class="tab-btn active" style="flex: 1; padding: 6px; font-family: inherit; font-size: 11px; cursor: pointer; border: 1px solid #6c5ce7; background: #6c5ce7; color: white; border-radius: 4px;">PLAYLISTS</button>
                    <button id="tab-queue-btn" class="tab-btn" style="flex: 1; padding: 6px; font-family: inherit; font-size: 11px; cursor: pointer; border: 1px solid #6c5ce7; background: transparent; color: #6c5ce7; border-radius: 4px;">QUEUE</button>
                </div>

                <div id="playlists-container" style="display: flex; flex-direction: column; height: calc(100% - 45px); overflow: hidden;">
                    <div id="playlists-grid-view" style="display: flex; flex-direction: column; height: 100%; overflow-y: auto; overflow-x: hidden;">
                        <div id="playlists-grid" class="playlists-grid" style="flex-grow: 1;">
                        </div>
                    </div>

                    <div id="playlist-detail-view" style="display: none; flex-direction: column; height: 100%; overflow-y: auto;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 5px;">
                            <button id="back-to-grid-btn" style="padding: 0; background: transparent; border: none; color: #6c5ce7; cursor: pointer; font-size: 16px; font-weight: bold; min-width: 20px;">&lt;</button>
                            <h3 id="current-playlist-title" style="color: #6c5ce7; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; text-align: left;">List Name</h3>
                        </div>
                        <div id="fav-list" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 5px; width: 100%; box-sizing: border-box;">
                        </div>
                    </div>
                </div>

                <div id="queue-container" style="display: none; flex-direction: column; height: calc(100% - 45px); overflow: hidden;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 5px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button id="queue-back-btn" style="padding: 0; background: transparent; border: none; color: #6c5ce7; cursor: pointer; font-size: 16px; font-weight: bold; min-width: 20px;">&lt;</button>
                            <h3 style="color: #6c5ce7; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;">UP NEXT</h3>
                        </div>
                        <button id="clear-queue-btn" style="background: transparent; border: none; color: #ff4757; cursor: pointer; font-size: 10px; font-family: inherit; padding: 0;">CLEAR</button>
                    </div>
                    <div id="queue-list" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 5px; width: 100%; box-sizing: border-box;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-prompt-modal" class="custom-modal hidden">
        <div class="custom-modal-content">
            <h3 id="prompt-title" style="margin-top: 0;">Name</h3>
            <input type="text" id="prompt-input" style="width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; font-family: inherit; border-radius: 4px; border: 1px solid #888;" />
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button id="prompt-ok" style="padding: 8px 25px; cursor: pointer; background: #6c5ce7; color: white; border: none; border-radius: 4px; font-weight: bold;"><span>SAVE</span></button>
                <button id="prompt-cancel" style="padding: 8px 25px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;"><span>CANCEL</span></button>
            </div>
        </div>
    </div>

    <div id="custom-confirm-modal" class="custom-modal hidden">
        <div class="custom-modal-content">
            <h3 id="confirm-title" style="margin-top: 0; font-size: 14px;">Are you sure?</h3>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button id="confirm-ok" style="padding: 8px 25px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 4px; font-weight: bold;"><span>YES</span></button>
                <button id="confirm-cancel" style="padding: 8px 25px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;"><span>NO</span></button>
            </div>
        </div>
    </div>

    <div id="add-to-playlist-modal" class="custom-modal hidden">
        <div class="custom-modal-content" style="width: 75%; max-width: 330px; max-height: 65vh; padding: 18px; display: flex; flex-direction: column;">
            <h3 style="margin-top: 0; text-align: center;">ADD TO PLAYLIST</h3>
            <div id="modal-playlists-grid" class="playlists-grid" style="flex-grow: 1; overflow-y: auto; overflow-x: hidden; margin-bottom: 10px;">
            </div>
            <div style="display: flex; justify-content: center;">
                <button id="close-add-modal-btn" style="padding: 8px 25px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;"><span>CANCEL</span></button>
            </div>
        </div>
    </div>

    <div id="custom-alert-modal" class="custom-modal hidden">
        <div class="custom-modal-content">
            <h3 id="alert-title" style="margin-top: 0; font-size: 14px; color: #ff4757;">Notice</h3>
            <p id="alert-message" style="font-size: 12px;"></p>
            <div style="display: flex; justify-content: center; margin-top: 15px;">
                <button id="alert-ok" style="padding: 8px 25px; cursor: pointer; background: #6c5ce7; color: white; border: none; border-radius: 4px; font-weight: bold;"><span>OK</span></button>
            </div>
        </div>
    </div>

    <script src="src/js/game.js"></script>
    <script src="src/js/renderer.js"></script>
</body>

</html>
